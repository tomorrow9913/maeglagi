name: maeglagi

# Supabase Auth, Storage, and PostgreSQL remain external. See docs/docker-deployment.md.
x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-production}
  APP_SECRET_KEY: ${APP_SECRET_KEY:?Set APP_SECRET_KEY in .env.docker}
  DATABASE_URL: ${DATABASE_URL:?Set the Supabase PostgreSQL connection in .env.docker}
  SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in .env.docker}
  SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?Set SUPABASE_PUBLISHABLE_KEY in .env.docker}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY in .env.docker}
  SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-sources}
  PROCESSING_EXECUTOR: ${PROCESSING_EXECUTOR:-celery}
  PG_EXECUTOR_ENABLED: ${PG_EXECUTOR_ENABLED:-true}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-memory://}
  CELERY_TASK_ALWAYS_EAGER: 'false'
  NEO4J_URI: ${NEO4J_URI:-}
  NEO4J_USERNAME: ${NEO4J_USERNAME:-}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
  LLM_PROVIDER: ${LLM_PROVIDER:-mock}
  DEMO_WORKSPACE_ID: ${DEMO_WORKSPACE_ID:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
  RATE_LIMIT_STORAGE_URI: ${RATE_LIMIT_STORAGE_URI:-memory://}
  RATE_LIMIT: ${RATE_LIMIT:-120/minute}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.0}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile
  image: maeglagi-backend:local
  environment: *backend-env
  restart: unless-stopped

services:
  frontend:
    image: maeglagi-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_USE_MOCKS: ${NEXT_PUBLIC_USE_MOCKS:-false}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set the public Supabase URL in .env.docker}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?Set the public Supabase key in .env.docker}
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-3000}:3000'
    restart: unless-stopped

  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - '127.0.0.1:${API_PORT:-8000}:8000'

  worker:
    <<: *backend
    command: ["celery", "-A", "app.core.celery:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    stop_grace_period: 120s

  pg-worker:
    <<: *backend
    profiles: [pg-worker]
    environment:
      <<: *backend-env
      PROCESSING_EXECUTOR: postgres
    command: ["python", "-m", "app.modules.ingestion.infrastructure.pg_worker"]
    stop_grace_period: 120s

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDISCLI_AUTH: ${REDIS_PASSWORD:-}
      REDIS_TLS_ENABLED: ${REDIS_TLS_ENABLED:-false}
    command: ["sh", "/usr/local/bin/maeglagi-redis-start"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
      - '${REDIS_TLS_BIND_ADDRESS:-127.0.0.1}:${REDIS_TLS_PORT:-6380}:6380'
    volumes:
      - redis-data:/data
      - ./docker/redis/start.sh:/usr/local/bin/maeglagi-redis-start:ro
      - ${REDIS_TLS_CERT_DIR:-./docker/redis/certs}:/tls:ro
    restart: unless-stopped

  neo4j:
    profiles: [neo4j]
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-this-password}
    ports:
      - '127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474'
      - '127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687'
    volumes:
      - neo4j-data:/data
    restart: unless-stopped

  ollama:
    profiles: [ollama]
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: '1'
    ports:
      - '127.0.0.1:${OLLAMA_PORT:-11434}:11434'
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  migrate:
    <<: *backend
    profiles: [tools]
    command: ["alembic", "upgrade", "head"]
    restart: 'no'

volumes:
  redis-data:
  neo4j-data:
  ollama-data:
