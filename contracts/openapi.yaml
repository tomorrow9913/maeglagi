openapi: 3.1.0
info:
  title: Maeglagi API
  version: 0.1.0
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: API health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
components:
  schemas:
    Health:
      type: object
      required: [status, service, version]
      properties:
        status: { type: string, const: ok }
        service: { type: string }
        version: { type: string }

