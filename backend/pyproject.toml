[project]
name = "maeglagi-backend"
version = "0.1.0"
description = "Organizational context platform API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "neo4j>=5.28,<7",
  "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "sqlmodel>=0.0.24,<1",
  "asyncpg>=0.30,<1",
  "cryptography>=45,<47",
  "asgi-correlation-id>=4.3,<5",
  "limits[redis]>=5,<6",
  "sentry-sdk[fastapi]>=2,<3",
  "structlog>=25,<27",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
