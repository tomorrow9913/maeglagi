name: CI · backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  push:
    branches: [develop, main]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

concurrency:
  group: ci-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ruff · pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # backend/.python-version(3.13)을 따릅니다.
          python-version-file: backend/.python-version

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Prepare disposable pgvector database
        run: |
          uv run python - <<'PYTHON'
          import asyncio
          import asyncpg
          async def prepare():
              connection = await asyncpg.connect("postgresql://postgres@127.0.0.1:5432/postgres")
              try:
                  await connection.execute("CREATE EXTENSION IF NOT EXISTS vector")
              finally:
                  await connection.close()
          asyncio.run(prepare())
          PYTHON

      # 모든 DB 검증은 이 작업에만 존재하는 로컬 서비스에서 수행합니다.
      - name: Test
        # 테스트가 공유하는 앱의 메모리 rate limiter가 전체 suite 요청을 막지 않도록 합니다.
        env:
          RATE_LIMIT: 100000/minute
          DATABASE_URL: postgresql+asyncpg://postgres@127.0.0.1:5432/postgres
          PG_EXECUTOR_TEST_DATABASE_URL: postgresql+asyncpg://postgres@127.0.0.1:5432/postgres
          ASK_TEST_DATABASE_URL: postgresql+asyncpg://postgres@127.0.0.1:5432/postgres
        run: uv run pytest -q
