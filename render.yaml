# PoC: API-local PostgreSQL executor. Apply migrations before activation.
# Optional Celery/Redis deployment remains in compose.yaml.
services:
  - type: web
    name: maeglagi-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PROCESSING_EXECUTOR
        value: postgres
      - key: PG_EXECUTOR_ENABLED
        value: "true"
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      - key: RATE_LIMIT
        value: 120/minute
      - key: RATE_LIMIT_STORAGE_URI
        value: memory://
      - key: LOG_LEVEL
        value: INFO
