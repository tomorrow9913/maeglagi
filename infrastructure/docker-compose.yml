name: maeglagi
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: maeglagi
      POSTGRES_USER: maeglagi
      POSTGRES_PASSWORD: maeglagi
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maeglagi"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis-data:/data]

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: maeglagi
      MINIO_ROOT_PASSWORD: maeglagi-local-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/maeglagi-local-password
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4j-data:/data]

volumes:
  postgres-data:
  redis-data:
  minio-data:
  neo4j-data:

